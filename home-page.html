<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú del Restaurante</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
          <button><p>🏠︎</p><p>Inicio</p></button>
          <button><p>⛶</p><p>Mesa</p></button>
          <button>Menu</button>
          <button>Ordenar</button>
          <button>Historial</button>
          <button>Reportar</button>
          <button>Notificaciones</button>
          <button>Configuracion</button>
        </nav>
    </header>
    <main>
        <section id="menu">
            <div class="barraBusqueda">
             <input type="text" placeholder="Buscar categoria o comida">
             <button>Buscar</button>
            </div>
            <div class="categoriasMenu">
                <button>Pizza</button>
                <button>Hamburguesas</button>
                <button>Arroz</button>
                <button>Snacks</button>
                <button>Bebidas</button>
            </div>
            <b>Escoge tu pedido</b>
            <div class="itemsMenu">
                <button>
                    <img src="Imagenes/pizza-hawaiana.jpg" alt="Pizza Hawaiana">
                    <div>
                     <p>Pizza Hawaiana</p>
                      <span>$8.99</span>
                      <small>10 Pan Available</small>
                    </div>
                </button>

                <button><img src="Imagenes/pizza-pollochampinones.webp" alt="Pizza pollo y champiñones">
                    <div>
                     <p>Pizza pollo y champiñones</p>
                      <span>$10.99</span>
                      <small>10 Pan Available</small>
                    </div></button>
                <button>
                    <img src="Imagenes/pizza-pepperoni.webp" alt="pizza de pepperoni">
                    <div>
                     <p>pizza de pepperoni</p>
                      <span>$12.99</span>
                      <small>11 Pan Available</small>
                    </div>
                </button>
                <button>
                    <img src="Imagenes/pizza-vegetariana.webp" alt="pizza vegetariana">
                    <div>
                     <p>pizza vegetariana</p>
                      <span>$8.99</span>
                      <small>11 Pan Available</small>
                    </div>
                </button>
                <button>
                    <img src="Imagenes/pizza-italiana.webp" alt="Pizza Italiana">
                    <div>
                        <p>Pizza Italiana</p>
                        <span>$9.50</span>
                        <small>8 Pan Available</small>
                    </div>
                </button>
                <button>
                    <img src="Imagenes/pizza-jamon.webp" alt="Pizza Jamón">
                    <div>
                        <p>Pizza Jamón</p>
                        <span>$11.00</span>
                        <small>9 Pan Available</small>
                    </div>
                </button>
                <button>
                    <img src="Imagenes/pizza-pollobbq.webp" alt="Pizza Pollo BBQ">
                    <div>
                        <p>Pizza Pollo BBQ</p>
                        <span>$11.50</span>
                        <small>10 Pan Available</small>
                    </div>
                </button>
                <button>
                    <img src="Imagenes/pizza-pomodoro.webp" alt="Pizza Pomodoro">
                    <div>
                        <p>Pizza Pomodoro</p>
                        <span>$9.25</span>
                        <small>12 Pan Available</small>
                    </div>
                </button>
                <button>
                    <img src="Imagenes/pizza-ranchpollotocineta.webp" alt="Pizza Ranch Pollo Tocineta">
                    <div>
                        <p>Pizza Ranch Pollo Tocineta</p>
                        <span>$13.50</span>
                        <small>8 Pan Available</small>
                    </div>
                </button>
                <button>
                    <img src="Imagenes/pizza-theWorks.webp" alt="Pizza The Works">
                    <div>
                        <p>Pizza The Works</p>
                        <span>$14.00</span>
                        <small>6 Pan Available</small>
                    </div>
                </button>
                <button>
                    <img src="Imagenes/papadias-italiana.webp" alt="Papadias italiana">
                    <div>
                        <p>Papadias italiana</p>
                        <span>$11.99</span>
                        <small>2 Pan Available</small>
                    </div>
                </button>
            </div>
        </section>
        <aside>
            <div class="ordenesActuales">
                
            </div>
            <button>Realizar pedido</button>
        </aside>
    </main>
    <footer>
       
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
