<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú del Restaurante</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
          <button>Inicio</button>
          <button>Mesa</button>
          <button>Menu</button>
          <button>Ordenar</button>
          <button>Historial</button>
          <button>Reportar</button>
          <button>Notificaciones</button>
          <button>Configuracion</button>
        </nav>
    </header>
    <main>
        <section id="menu">
            <div class="barraBusqueda">
             <input type="text" placeholder="Buscar categoria o comida">
             <button>Buscar</button>
            </div>
            <div class="categoriasMenu">
                <button>Pizza</button>
                <button>Hamburguesas</button>
                <button>Arroz</button>
                <button>Snacks</button>
                <button>Bebidas</button>
            </div>
            <p>Escoger tu pedido</p>
            <div class="itemsMenu">
                <button>
                    <img src="pizza-hawaiana.jpg" alt="Pizza Hawaiana">
                    <div>
                     <p>Pizza Hawaiana</p>
                      <span>$8.99</span>
                      <small>10 Pan Available</small>
                    </div>
                </button>

                <button>Pizza pollo con champiñones</button>
                <button>pizza de carne</button>
                <button>Pizza vegetariana</button>
            </div>
        </section>
        <aside>
            <div class="ordenesActuales">
                
            </div>
            <button>Realizar pedido</button>
        </aside>
    </main>
    <footer>
       
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
